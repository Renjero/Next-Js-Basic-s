<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Ludo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="playerOneResult" class="sidebar">
        <h3>Player 1</h3>
    </div>

    <div class="container">

        <h1>JS Ludo</h1>
        <h3 id="score">Round 0 / 10</h3>

        <div class="dice">
            <p>Player One</p>
            <img src="images/dice1.png" id="cheack1">
        </div>

        <div class="dice">
            <p>Player Two</p>
            <img src="images/dice1.png" id="cheack2">
        </div>

        <div>
            <button onclick="ludogame()">Flip The Dice</button>
        </div>

    </div>

    <div id="playerTwoResult" class="sidebar">
        <h3>Player 2</h3>
    </div>

    <script src="main.js"></script>
</body>
</html>
